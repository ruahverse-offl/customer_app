name: new_balan_app
description: New Balan Medical — Customer App
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # Navigation
  go_router: ^14.2.0

  # State management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # HTTP
  dio: ^5.4.3+1
  pretty_dio_logger: ^1.3.1

  # Secure storage (token)
  flutter_secure_storage: ^9.2.2

  # Local storage (cart)
  hive_flutter: ^1.1.0

  # Push notifications
  firebase_core: ^3.3.0
  firebase_messaging: ^15.1.0
  flutter_local_notifications: ^17.2.2

  # Invoice + sharing
  pdf: ^3.11.1
  printing: ^5.13.1
  share_plus: ^10.0.0

  # Payments
  razorpay_flutter: ^1.3.6

  # File picker (prescription upload)
  file_picker: ^8.1.2

  # Image display
  cached_network_image: ^3.3.1

  # UI utilities
  flutter_svg: ^2.0.10+1
  shimmer: ^3.0.0
  badges: ^3.1.2
  url_launcher: ^6.3.0
  intl: ^0.19.0
  equatable: ^2.0.5

  # Icons
  cupertino_icons: ^1.0.8
  material_symbols_icons: ^4.2719.2

  # Local key-value storage (notification prefs)
  shared_preferences: ^2.3.2

  # Environment
  flutter_dotenv: ^5.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.11
  riverpod_generator: ^2.4.0
  hive_generator: ^2.0.1

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/images/
    - assets/icons/

  fonts:
    - family: Outfit
      fonts:
        - asset: assets/fonts/Outfit-Bold.ttf
          weight: 700
        - asset: assets/fonts/Outfit-ExtraBold.ttf
          weight: 800
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
