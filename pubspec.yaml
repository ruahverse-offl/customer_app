name: new_balan_app
description: New Balan Medical — Customer App
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # Navigation
  go_router: ^14.6.3

  # State management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # HTTP
  dio: ^5.8.0+1
  pretty_dio_logger: ^1.4.0

  # Secure storage (token)
  flutter_secure_storage: ^9.2.4

  # Local storage (cart)
  hive_flutter: ^1.1.0

  # Push notifications
  firebase_core: ^3.13.0
  firebase_messaging: ^15.2.5
  flutter_local_notifications: ^18.0.1

  # Invoice + sharing
  pdf: ^3.11.3
  printing: ^5.14.2
  share_plus: ^10.1.4

  # Payments
  razorpay_flutter: ^1.4.5

  # File picker (prescription upload)
  file_picker: ^8.3.7

  # File path / save to device
  path_provider: ^2.1.5
  permission_handler: ^11.3.1

  # Image display
  cached_network_image: ^3.4.1

  # UI utilities
  flutter_svg: ^2.0.17
  shimmer: ^3.0.0
  badges: ^3.1.2
  url_launcher: ^6.3.1
  intl: ^0.20.2
  equatable: ^2.0.7

  # Icons
  cupertino_icons: ^1.0.8
  material_symbols_icons: ^4.2789.1

  # Local key-value storage (notification prefs)
  shared_preferences: ^2.5.3

  # Environment
  flutter_dotenv: ^5.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.11
  riverpod_generator: ^2.4.0
  hive_generator: ^2.0.1
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/app_icon.png"
  min_sdk_android: 21
  web:
    generate: false

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/images/
    - assets/icons/

  fonts:
    - family: Outfit
      fonts:
        - asset: assets/fonts/Outfit-Bold.ttf
          weight: 700
        - asset: assets/fonts/Outfit-ExtraBold.ttf
          weight: 800
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
